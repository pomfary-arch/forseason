<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevStudio Ultimate Mobile IDE</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #151c2c;
            --bg-input: #0f172a;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --font-size: 13px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--bg-card); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-weight: 800; font-size: 15px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .project-tag { font-size: 11px; background: #0284c722; color: var(--primary); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--primary); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .app-view { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
        .app-view.active { display: flex; }

        .repo-container { padding: 14px; overflow-y: auto; height: 100%; }
        .repo-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .btn-main { background: var(--primary); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .project-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .project-card h3 { font-size: 14px; color: var(--text-main); }
        .project-card p { font-size: 11px; color: var(--text-muted); }
        .card-actions { display: flex; gap: 6px; }
        .btn-sub { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 11px; cursor: pointer; }
        .btn-sub.open { background: var(--primary); color: #000; font-weight: bold; border: none; }

        .editor-container { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 6px; height: 100%; }
        .editor-tools { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); }
        .symbol-bar { display: flex; gap: 6px; background: var(--bg-card); padding: 6px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; }
        .symbol-btn { background: var(--bg-input); color: var(--primary); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        textarea.smart-editor { flex: 1; width: 100%; background: var(--bg-input); color: #38bdf8; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Courier New', monospace; font-size: var(--font-size); resize: none; outline: none; line-height: 1.5; direction: ltr; text-align: left; }

        .error-modal { position: absolute; bottom: 0; left: 0; right: 0; background: #151c2c; border-top: 2px solid var(--danger); padding: 14px; z-index: 1000; max-height: 65%; overflow-y: auto; display: none; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); }
        .error-modal.active { display: flex; flex-direction: column; gap: 10px; }
        .fix-option-card { background: var(--bg-input); border: 1px solid var(--border); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }

        .preview-bar { background: var(--bg-card); padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .preview-bar select { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 11px; }
        .frame-wrapper { flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; position: relative; }
        iframe { border: none; background: #fff; transition: 0.3s; width: 100%; height: 100%; }
        iframe.mobile-view { width: 375px; height: 667px; border-radius: 12px; border: 4px solid var(--border); }

        nav.bottom-nav { background: var(--bg-card); border-top: 1px solid var(--border); display: flex; height: 56px; z-index: 100; }
        .nav-btn { flex: 1; border: none; background: transparent; color: var(--text-muted); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 10px; gap: 3px; cursor: pointer; }
        .nav-btn.active { color: var(--primary); font-weight: bold; }
        .nav-btn span.icon { font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ DevStudio Ultimate</div>
        <div class="project-tag" id="active-project-tag">المشروع: افتراضي</div>
    </header>
        <div class="app-view active" id="view-repo">
        <div class="repo-container">
            <div class="repo-top">
                <h3>📁 مستودع المشاريع</h3>
                <button class="btn-main" onclick="createNewProject()">➕ مشروع جديد</button>
            </div>
            <div class="project-grid" id="project-grid"></div>
        </div>
    </div>

    <div class="app-view" id="view-editor">
        <div class="editor-container">
            <div class="editor-tools">
                <span>المحرر الذكي + كاشف الأخطاء</span>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-main" style="padding: 4px 10px; font-size: 10px; background: var(--accent);" onclick="runCodeAuditor()">🔍 تدقيق الكود</button>
                    <span id="code-stats">0 بايت</span>
                </div>
            </div>
            <div class="symbol-bar">
                <button class="symbol-btn" onclick="insertSymbol('<')">&lt;</button>
                <button class="symbol-btn" onclick="insertSymbol('>')">&gt;</button>
                <button class="symbol-btn" onclick="insertSymbol('/')">/</button>
                <button class="symbol-btn" onclick="insertSymbol('{')">{</button>
                <button class="symbol-btn" onclick="insertSymbol('}')">}</button>
                <button class="symbol-btn" onclick="insertSymbol('(')">(</button>
                <button class="symbol-btn" onclick="insertSymbol(')')">)</button>
                <button class="symbol-btn" onclick="insertSymbol(';')">;</button>
                <button class="symbol-btn" onclick="insertSymbol('&quot;')">"</button>
                <button class="symbol-btn" onclick="insertSymbol('=')">=</button>
            </div>
            <textarea id="smart-editor" class="smart-editor" placeholder="أدخل الكود الكامل المدمج هنا (HTML, CSS, JS)..." oninput="handleCodeInput()"></textarea>
        </div>
        
        <div class="error-modal" id="errorModal">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 style="color: var(--danger); font-size: 13px;">🚨 تقرير فحص وتدقيق الأخطاء</h4>
                <button onclick="closeErrorModal()" style="background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer;">✕</button>
            </div>
            <div id="error-content" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <div class="app-view" id="view-preview">
        <div class="preview-bar">
            <select onchange="changeDeviceView(this.value)">
                <option value="full">عرض ملء الشاشة</option>
                <option value="mobile">محاكي هاتف (375px)</option>
            </select>
            <button class="btn-main" onclick="openExternalLink()">🌐 رابط خارجي</button>
        </div>
        <div class="frame-wrapper">
            <iframe id="preview-iframe"></iframe>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-repo" onclick="switchNav('repo')">
            <span class="icon">📁</span>
            <span>المستودع</span>
        </button>
        <button class="nav-btn" id="nav-editor" onclick="switchNav('editor')">
            <span class="icon">💻</span>
            <span>المحرر الذكي</span>
        </button>
        <button class="nav-btn" id="nav-preview" onclick="switchNav('preview')">
            <span class="icon">👁</span>
            <span>المعاينة</span>
        </button>
    </nav>
        <script>
        let projects = JSON.parse(localStorage.getItem('devstudio_projects_v3')) || {
            "p_default": {
                name: "مشروع افتراضي تجريبي",
                updated: new Date().toISOString().split('T')[0],
                code: `<div style="text-align: center; padding: 40px; font-family: sans-serif;">\n  <h1 style="color: #38bdf8;">DevStudio Ultimate</h1>\n  <p style="color: #64748b;">تطبيقك يعمل بنجاح مع الفرز ونظام التدقيق الذكي!</p>\n  <button onclick="alert('شغال تمام!')" style="background: #38bdf8; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 15px; font-weight: bold; cursor: pointer;">تجربة التفاعل</button>\n</div>`
            }
        };

        let activeProjectId = localStorage.getItem('devstudio_active_proj_v3') || "p_default";

        function switchNav(target) {
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`view-${target}`).classList.add('active');
            document.getElementById(`nav-${target}`).classList.add('active');

            if (target === 'preview') renderPreview();
            if (target === 'repo') renderRepo();
        }

        function renderRepo() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';

            Object.keys(projects).forEach(id => {
                const proj = projects[id];
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <h3>${proj.name}</h3>
                    <p>آخر تعديل: ${proj.updated}</p>
                    <div class="card-actions">
                        <button class="btn-sub open" onclick="openProject('${id}')">فتح بالمحرر</button>
                        <button class="btn-sub" style="border-color: var(--danger); color: var(--danger);" onclick="deleteProject('${id}')">حذف</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function createNewProject() {
            const name = prompt("أدخل اسم المشروع الجديد:");
            if (name) {
                const id = 'p_' + Date.now();
                projects[id] = {
                    name: name,
                    updated: new Date().toISOString().split('T')[0],
                    code: `<!-- كود مشروع ${name} -->\n<h1>${name}</h1>`
                };
                saveRepo();
                openProject(id);
            }
        }

        function openProject(id) {
            activeProjectId = id;
            localStorage.setItem('devstudio_active_proj_v3', id);
            document.getElementById('active-project-tag').innerText = `المشروع: ${projects[id].name}`;
            document.getElementById('smart-editor').value = projects[id].code;
            handleCodeInput();
            switchNav('editor');
        }

        function deleteProject(id) {
            if (confirm("هل أنت تأكد من حذف المشروع؟")) {
                delete projects[id];
                saveRepo();
                renderRepo();
            }
        }

        function saveRepo() {
            localStorage.setItem('devstudio_projects_v3', JSON.stringify(projects));
        }

        function handleCodeInput() {
            const code = document.getElementById('smart-editor').value;
            document.getElementById('code-stats').innerText = `${new Blob([code]).size} بايت`;

            if (projects[activeProjectId]) {
                projects[activeProjectId].code = code;
                projects[activeProjectId].updated = new Date().toISOString().split('T')[0];
                saveRepo();
            }
        }

        function insertSymbol(symbol) {
            const editor = document.getElementById('smart-editor');
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;

            editor.value = text.substring(0, start) + symbol + text.substring(end);
            editor.selectionStart = editor.selectionEnd = start + symbol.length;
            editor.focus();
            handleCodeInput();
        }

        function runCodeAuditor() {
            const code = document.getElementById('smart-editor').value;
            const lines = code.split('\n');
            let foundErrors = [];

            lines.forEach((line, index) => {
                let lineNum = index + 1;
                
                if ((line.includes('document.getElementById') || line.includes('console.log')) && !line.includes(')')) {
                    foundErrors.push({
                        line: lineNum,
                        type: "قوس دالة غير مغلق",
                        desc: `السطر رقم ${lineNum} يحتوي على دالة لم يتم إغلاق أقواسها بالشكل الصحيح.`,
                        fixText: line + ')'
                    });
                }

                if (line.includes('<div') && !line.includes('</div>') && !line.includes('/>') && !line.includes('>')) {
                    foundErrors.push({
                        line: lineNum,
                        type: "وسم HTML غير مكتمل",
                        desc: `السطر رقم ${lineNum} يحتوي على وسم div مفتوح ولم يتم إغلاقه بدقة.`,
                        fixText: line + '>'
                    });
                }
            });

            const modal = document.getElementById('errorModal');
            const content = document.getElementById('error-content');
            content.innerHTML = '';

            if (foundErrors.length === 0) {
                content.innerHTML = `
                    <div style="background: rgba(34,197,94,0.1); border: 1px solid var(--accent); padding: 10px; border-radius: 6px; color: var(--accent); font-size: 11px;">
                        ✅ لم يتم رصد أي أخطاء برمجية حرجة! كودك نظيف وجاهز للتشغيل.
                    </div>
                `;
            } else {
                foundErrors.forEach(err => {
                    content.innerHTML += `
                        <div class="fix-option-card">
                            <p style="color: var(--danger); font-weight: bold; font-size: 11px;">⚠️ خطأ في السطر (${err.line}): ${err.type}</p>
                            <p style="color: var(--text-muted); font-size: 10px;"><b>الشرح:</b> ${err.desc}</p>
                            <div style="margin-top: 4px; display: flex; gap: 6px;">
                                <button onclick="applyAutoFix(${err.line}, '${err.fixText.replace(/'/g, "\\'")}')" style="background: var(--accent); color: #000; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer;">
                                    🛠️ إصلاح تلقائي فوري
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
            modal.classList.add('active');
        }

        function closeErrorModal() {
            document.getElementById('errorModal').classList.remove('active');
        }

        function applyAutoFix(lineNum, newText) {
            const editor = document.getElementById('smart-editor');
            let lines = editor.value.split('\n');
            lines[lineNum - 1] = newText;
            editor.value = lines.join('\n');
            handleCodeInput();
            closeErrorModal();
            alert("تم تطبيق الإصلاح بنجاح على السطر " + lineNum);
        }

        function renderPreview() {
            const rawCode = document.getElementById('smart-editor').value;
            const frame = document.getElementById('preview-iframe').contentWindow.document;
            frame.open();
            frame.write(rawCode);
            frame.close();
        }

        function changeDeviceView(mode) {
            const iframe = document.getElementById('preview-iframe');
            if (mode === 'mobile') {
                iframe.classList.add('mobile-view');
            } else {
                iframe.classList.remove('mobile-view');
            }
        }

        function openExternalLink() {
            const rawCode = document.getElementById('smart-editor').value;
            const blob = new Blob([rawCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        if (projects[activeProjectId]) {
            openProject(activeProjectId);
        } else {
            renderRepo();
        }
    </script>
</body>
</html>
