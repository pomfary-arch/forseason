<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub - محرر الأكواد الذكي</title>
    <style>
        :root {
            --bg-main: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-green: #238636;
            --text-main: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* الترويسة الرئيسية */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #58a6ff;
        }

        .btn-run {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-run:hover {
            opacity: 0.9;
        }

        /* منطقة العمل والمحررات */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-section {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .tab-bar {
            background-color: var(--panel-bg);
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #8b949e;
        }

        .tab.active {
            border-bottom-color: #f78166;
            color: var(--text-main);
            background: #21262d;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-main);
            color: #e6edf3;
            border: none;
            padding: 15px;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            direction: ltr;
        }

        /* شاشة المعاينة المباشرة */
        .preview-section {
            width: 50%;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- الترويسة -->
    <header>
        <div class="logo">⚡ DevHub Editor</div>
        <button class="btn-run" onclick="runCode()">▶ تشغيل الكود</button>
    </header>

    <!-- منطقة المحرر والمعاينة -->
    <div class="workspace">
        
        <!-- قسم كتابة الكود -->
        <div class="editor-section">
            <div class="tab-bar">
                <div class="tab active" onclick="switchTab('html')">HTML</div>
                <div class="tab" onclick="switchTab('css')">CSS</div>
                <div class="tab" onclick="switchTab('js')">JS</div>
            </div>

            <textarea id="htmlCode" placeholder="أكتب كود HTML هنا..."></textarea>
            <textarea id="cssCode" placeholder="أكتب كود CSS هنا..." style="display: none;"></textarea>
            <textarea id="jsCode" placeholder="أكتب كود JavaScript هنا..." style="display: none;"></textarea>
        </div>

        <!-- قسم شاشة النتيجة -->
        <div class="preview-section">
            <iframe id="previewFrame"></iframe>
        </div>

    </div>

    <script>
        let currentTab = 'html';

        // التبديل بين ألسنة المحرر (HTML / CSS / JS)
        function switchTab(tab) {
            currentTab = tab;
            
            // إخفاء كل النصوص
            document.getElementById('htmlCode').style.display = 'none';
            document.getElementById('cssCode').style.display = 'none';
            document.getElementById('jsCode').style.display = 'none';

            // تفعيل التبويب المحدد
            document.getElementById(tab + 'Code').style.display = 'block';

            // تغيير شكل الأزرار
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        // تشغيل الكود وعرضه داخل الـ iframe
        function runCode() {
            const html = document.getElementById('htmlCode').value;
            const css = "<style>" + document.getElementById('cssCode').value + "</style>";
            const js = "<script>" + document.getElementById('jsCode').value + "<\/script>";

            const iframe = document.getElementById('previewFrame').contentWindow.document;

            iframe.open();
            iframe.write(html + css + js);
            iframe.close();
        }

        // تشغيل تلقائي أولي
        runCode();
    </script>
</body>
</html>
