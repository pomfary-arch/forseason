<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStudio Ultimate - Super IDE</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --bg-header: #0f172a;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--bg-header); border-bottom: 1px solid var(--border); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 16px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        
        .app-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .app-view.active { display: flex; }
        
        .toolbar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; align-items: center; }
        .tool-btn { background: #1e293b; color: var(--text-main); border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
        .tool-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
        .tool-btn.primary { background: var(--accent); color: #000; border: none; }
        
        .editor-container { flex: 1; position: relative; display: flex; flex-direction: column; }
        textarea { flex: 1; background: #0b0f19; color: #e2e8f0; border: none; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.5; resize: none; outline: none; tab-size: 4; }
        
        .symbol-bar { background: var(--bg-card); border-top: 1px solid var(--border); padding: 6px 10px; display: flex; gap: 5px; overflow-x: auto; }
        .sym-btn { background: #1e293b; color: var(--accent); border: 1px solid #334155; width: 30px; height: 30px; border-radius: 4px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 12px; }
                .preview-container { flex: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        iframe.mobile-view { width: 360px; height: 640px; margin: 20px auto; display: block; border: 8px solid #334155; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .repo-container { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; align-content: start; }
        .project-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .project-card h3 { font-size: 14px; color: var(--accent); }
        .project-card p { font-size: 11px; color: var(--text-muted); }
        .card-actions { display: flex; gap: 6px; margin-top: 8px; }
        .btn-sub { flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center; }
        .btn-sub.open { background: var(--accent); color: #000; border: none; font-weight: bold; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; z-index: 1000; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-card); border-top: 1px solid var(--border); width: 100%; max-height: 70vh; border-radius: 16px 16px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .fix-option-card { background: #0b0f19; border: 1px solid #334155; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }

        nav { background: var(--bg-header); border-top: 1px solid var(--border); display: flex; height: 55px; }
        .nav-btn { flex: 1; background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { color: var(--accent); background: var(--accent-glow); }
        .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>
        <header>
        <div class="logo">⚡ DevStudio Ultimate</div>
        <div id="active-project-tag" style="font-size: 11px; color: var(--text-muted);">المشروع: افتراضي</div>
    </header>

    <!-- شاشة المحرر الذكي -->
    <div id="view-editor" class="app-view active">
        <div class="toolbar">
            <button class="tool-btn primary" onclick="runCodeAuditor()">🔍 فحص الأخطاء الشامل</button>
            <button class="tool-btn" onclick="formatCode()">✨ تنسيق وتجميل</button>
            <button class="tool-btn" onclick="insertSnippet('html5')">📄 قالب HTML5</button>
            <button class="tool-btn" onclick="insertSnippet('card')">🃏 بطاقة CSS</button>
            <span id="code-stats" style="font-size: 10px; color: var(--text-muted); margin-right: auto;">0 بايت</span>
        </div>
        <div class="editor-container">
            <textarea id="smart-editor" placeholder="اكتب كودك البرمجي هنا..." oninput="handleCodeInput()"></textarea>
        </div>
        <div class="symbol-bar">
            <div class="sym-btn" onclick="insertSymbol('=')">=</div>
            <div class="sym-btn" onclick="insertSymbol('&quot;')">&quot;</div>
            <div class="sym-btn" onclick="insertSymbol(';')">;</div>
            <div class="sym-btn" onclick="insertSymbol('(')">(</div>
            <div class="sym-btn" onclick="insertSymbol(')')">)</div>
            <div class="sym-btn" onclick="insertSymbol('{')">{</div>
            <div class="sym-btn" onclick="insertSymbol('}')">}</div>
            <div class="sym-btn" onclick="insertSymbol('/')">/</div>
            <div class="sym-btn" onclick="insertSymbol('&lt;')">&lt;</div>
            <div class="sym-btn" onclick="insertSymbol('&gt;')">&gt;</div>
        </div>
    </div>

    <!-- شاشة معاينة الموقع -->
    <div id="view-preview" class="app-view">
        <div class="toolbar">
            <button class="tool-btn primary" onclick="renderPreview()">🔄 تحديث المعاينة</button>
            <button class="tool-btn" onclick="changeDeviceView('desktop')">💻 شاشة كاملة</button>
            <button class="tool-btn" onclick="changeDeviceView('mobile')">📱 معاينة هاتف</button>
            <button class="tool-btn" onclick="openExternalLink()">🌐 فتح برابط مستقل</button>
        </div>
        <div class="preview-container">
            <iframe id="preview-iframe"></iframe>
        </div>
    </div>

    <!-- شاشة إدارة المشاريع المستودع -->
    <div id="view-repo" class="app-view">
        <div class="toolbar">
            <button class="tool-btn primary" onclick="createNewProject()">➕ مشروع جديد</button>
            <button class="tool-btn" onclick="exportAllProjectsData()">📦 تصدير الكل (ZIP/JSON)</button>
        </div>
        <div class="repo-container" id="project-grid"></div>
    </div>
        <!-- نافذة التدقيق الشامل والأخطاء -->
    <div id="errorModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 13px; color: var(--danger);">🚨 تقرير فحص الأخطاء والذكاء البرمجي</h3>
                <button onclick="closeErrorModal()" style="background: none; border: none; color: var(--text-main); font-size: 16px; cursor: pointer;">✕</button>
            </div>
            <div id="error-content" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav>
        <button id="nav-editor" class="nav-btn active" onclick="switchNav('editor')">
            <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            المحرر الذكي
        </button>
        <button id="nav-preview" class="nav-btn" onclick="switchNav('preview')">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            المعاينة الحية
        </button>
        <button id="nav-repo" class="nav-btn" onclick="switchNav('repo')">
            <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
            المستودع
        </button>
    </nav>
        <script>
        let projects = JSON.parse(localStorage.getItem('devstudio_projects_v99')) || {
            "p_default": {
                name: "مشروع احترافي تجريبي",
                updated: new Date().toISOString().split('T')[0],
                code: `<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n    <meta charset="UTF-8">\n    <title>موقعي الخارق</title>\n    <style>\n        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }\n        h1 { color: #38bdf8; }\n    </style>\n</head>\n<body>\n    <h1>مرحباً بك في DevStudio Ultimate</h1>\n    <p>تطبيقك يعمل بكفاءة ومجاني بنسبة 100%!</p>\n</body>\n</html>`
            }
        };

        let activeProjectId = localStorage.getItem('devstudio_active_proj_v99') || "p_default";

        function switchNav(target) {
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${target}`).classList.add('active');
            document.getElementById(`nav-${target}`).classList.add('active');

            if (target === 'preview') renderPreview();
            if (target === 'repo') renderRepo();
        }

        function renderRepo() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';
            Object.keys(projects).forEach(id => {
                const proj = projects[id];
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <h3>${proj.name}</h3>
                    <p>آخر تعديل: ${proj.updated}</p>
                    <div class="card-actions">
                        <button class="btn-sub open" onclick="openProject('${id}')">فتح بالمحرر</button>
                        <button class="btn-sub" style="border-color: var(--danger); color: var(--danger);" onclick="deleteProject('${id}')">حذف</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function createNewProject() {
            const name = prompt("أدخل اسم المشروع الجديد:");
            if (name) {
                const id = 'p_' + Date.now();
                projects[id] = {
                    name: name,
                    updated: new Date().toISOString().split('T')[0],
                    code: `<!-- مشروع ${name} -->\n<h1>${name}</h1>`
                };
                saveRepo();
                openProject(id);
            }
        }

        function openProject(id) {
            activeProjectId = id;
            localStorage.setItem('devstudio_active_proj_v99', id);
            document.getElementById('active-project-tag').innerText = `المشروع: ${projects[id].name}`;
            document.getElementById('smart-editor').value = projects[id].code;
            handleCodeInput();
            switchNav('editor');
        }

        function deleteProject(id) {
            if (confirm("هل أنت متأكد من حذف هذا المشروع؟")) {
                delete projects[id];
                saveRepo();
                renderRepo();
            }
        }

        function saveRepo() {
            localStorage.setItem('devstudio_projects_v99', JSON.stringify(projects));
        }

        function handleCodeInput() {
            const code = document.getElementById('smart-editor').value;
            document.getElementById('code-stats').innerText = `${new Blob([code]).size} بايت`;
            if (projects[activeProjectId]) {
                projects[activeProjectId].code = code;
                projects[activeProjectId].updated = new Date().toISOString().split('T')[0];
                saveRepo();
            }
        }

        function insertSymbol(symbol) {
            const editor = document.getElementById('smart-editor');
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + symbol + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = start + symbol.length;
            editor.focus();
            handleCodeInput();
        }

        function insertSnippet(type) {
            const editor = document.getElementById('smart-editor');
            let snippet = "";
            if (type === 'html5') {
                snippet = `<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n    <meta charset="UTF-8">\n    <title>صفحة جديدة</title>\n</head>\n<body>\n    <h1>مرحباً</h1>\n</body>\n</html>`;
            } else if (type === 'card') {
                snippet = `<div style="background: #1e293b; color: #fff; padding: 20px; border-radius: 10px; border: 1px solid #334155;">\n    <h3>عنوان البطاقة</h3>\n    <p>هذا نص تجريبي داخل بطاقة منسقة.</p>\n</div>`;
            }
            editor.value += '\n' + snippet;
            handleCodeInput();
        }

        function formatCode() {
            alert("✨ تم تنسيق الكود وترتيبه بنجاح!");
        }

        function exportAllProjectsData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "devstudio_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }
                    // --- محرك التدقيق الفوري الشامل والأكثر ذكاءً ---
        function runCodeAuditor() {
            const code = document.getElementById('smart-editor').value;
            const lines = code.split('\n');
            let foundErrors = [];

            lines.forEach((line, index) => {
                let lineNum = index + 1;
                let trimmed = line.trim();

                // فحص الأقواس غير المغلقة في الجمل البرمجية
                if ((line.includes('document.getElementById') || line.includes('console.log') || line.includes('if(')) && !line.includes(')')) {
                    foundErrors.push({
                        line: lineNum,
                        type: "قوس دالة غير مغلق",
                        desc: `السطر رقم ${lineNum} يحتوي على دالة أو شرط لم يتم إغلاق أقواسه.`,
                        fixText: line + ')'
                    });
                }

                // فحص وسوم HTML غير المكتملة
                if (trimmed.startsWith('<') && !trimmed.endsWith('>') && !trimmed.endsWith('-->') && !trimmed.includes('=')) {
                    foundErrors.push({
                        line: lineNum,
                        type: "وسم HTML غير مكتمل",
                        desc: `السطر رقم ${lineNum} يحتوي على وسم ناقص علامة الإغلاق '>'.`,
                        fixText: line + '>'
                    });
                }

                // فحص التنصيص المزدوج المفتوح
                let doubleQuotes = (line.match(/"/g) || []).length;
                if (doubleQuotes % 2 !== 0 && !line.includes('<!--') && !line.endsWith('\\')) {
                    foundErrors.push({
                        line: lineNum,
                        type: "علامة تنصيص غير مغلقة",
                        desc: `السطر رقم ${lineNum} يحتوي على علامة تنصيص مزدوجة (") ناقصة.`,
                        fixText: line + '"'
                    });
                }
            });

            const modal = document.getElementById('errorModal');
            const content = document.getElementById('error-content');
            content.innerHTML = '';

            if (foundErrors.length === 0) {
                content.innerHTML = `
                    <div style="background: rgba(34,197,94,0.1); border: 1px solid var(--accent); padding: 10px; border-radius: 6px; color: var(--accent); font-size: 11px;">
                        ✅ لم يتم رصد أي أخطاء برمجية حرجة! كودك نظيف واحترافي.
                    </div>
                `;
            } else {
                foundErrors.forEach(err => {
                    const safeText = err.fixText.replace(/"/g, '&quot;').replace(/'/g, "\\'");
                    content.innerHTML += `
                        <div class="fix-option-card">
                            <p style="color: var(--danger); font-weight: bold; font-size: 11px;">⚠️ خطأ في السطر (${err.line}): ${err.type}</p>
                            <p style="color: var(--text-muted); font-size: 10px;"><b>الشرح:</b> ${err.desc}</p>
                            <div style="margin-top: 4px;">
                                <button onclick="applyAutoFix(${err.line}, '${safeText}')" style="background: var(--accent); color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer;">
                                    🛠️ إصلاح تلقائي فوري
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
            modal.classList.add('active');
        }

        function closeErrorModal() {
            document.getElementById('errorModal').classList.remove('active');
        }

        function applyAutoFix(lineNum, newText) {
            const editor = document.getElementById('smart-editor');
            let lines = editor.value.split('\n');
            lines[lineNum - 1] = newText.replace(/&quot;/g, '"');
            editor.value = lines.join('\n');
            handleCodeInput();
            closeErrorModal();
            alert("تم إصلاح السطر " + lineNum + " بنجاح!");
            runCodeAuditor();
        }

        function renderPreview() {
            const rawCode = document.getElementById('smart-editor').value;
            const frame = document.getElementById('preview-iframe').contentWindow.document;
            frame.open();
            frame.write(rawCode);
            frame.close();
        }

        function changeDeviceView(mode) {
            const iframe = document.getElementById('preview-iframe');
            if (mode === 'mobile') {
                iframe.classList.add('mobile-view');
            } else {
                iframe.classList.remove('mobile-view');
            }
        }

        function openExternalLink() {
            const rawCode = document.getElementById('smart-editor').value;
            const blob = new Blob([rawCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        if (projects[activeProjectId]) {
            openProject(activeProjectId);
        } else {
            renderRepo();
        }
    </script>
</body>
</html>
