<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevStudio Mobile Edition</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --accent-blue: #007acc;
            --accent-green: #28a745;
            --border: #333333;
            --text: #ffffff;
            --text-dim: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* الشريط العلوي */
        header { background: var(--panel-bg); padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; color: var(--accent-blue); font-size: 14px; }
        .header-btns { display: flex; gap: 6px; }

        button { background: #2d2d2d; color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
        button.btn-run { background: var(--accent-green); border: none; }
        button.btn-pub { background: var(--accent-blue); border: none; }

        /* شريط التبديل بين الملفات والمعاينة */
        .view-toggler { background: #181818; display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; text-align: center; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); border-radius: 0; font-size: 13px; }
        .tab-btn.active { color: var(--text); border-bottom-color: var(--accent-blue); background: var(--panel-bg); }

        /* شريط اختيارات الملفات */
        .file-bar { background: var(--panel-bg); padding: 6px 10px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .file-chip { background: #2a2a2a; color: var(--text-dim); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-family: monospace; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
        .file-chip.active { background: #007acc22; color: var(--accent-blue); border-color: var(--accent-blue); }

        /* منطقة العمل الرئيسية */
        .main-container { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        .page { width: 100%; height: 100%; display: none; }
        .page.active { display: block; }

        /* المحرر */
        textarea { width: 100%; height: 100%; background: var(--bg-dark); color: #00ffcc; border: none; padding: 12px; font-family: "Courier New", monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; direction: ltr; text-align: left; }

        /* المعاينة */
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>

    <!-- الترويسة -->
    <header>
        <div class="logo">⚡ DevStudio Mobile</div>
        <div class="header-btns">
            <button class="btn-run" onclick="runAndPreview()">▶ تشغيل</button>
            <button class="btn-pub" onclick="publishSite()">🌐 نشر</button>
        </div>
    </header>

    <!-- شريط الملفات -->
    <div class="file-bar">
        <div class="file-chip active" id="chip-html" onclick="selectFile('html')">index.html</div>
        <div class="file-chip" id="chip-css" onclick="selectFile('css')">style.css</div>
        <div class="file-chip" id="chip-js" onclick="selectFile('js')">app.js</div>
    </div>

    <!-- شريط التنقل الرئيسي (كود / معاينة) -->
    <div class="view-toggler">
        <button class="tab-btn active" id="tab-editor" onclick="switchView('editor')">💻 المحرر</button>
        <button class="tab-btn" id="tab-preview" onclick="switchView('preview')">👁 المعاينة المباشرة</button>
    </div>

    <!-- منطقة العرض -->
    <div class="main-container">
        <!-- صفحة المحرر -->
        <div class="page active" id="page-editor">
            <textarea id="code-html" placeholder="أكتب كود HTML هنا..."></textarea>
            <textarea id="code-css" placeholder="أكتب كود CSS هنا..." style="display: none;"></textarea>
            <textarea id="code-js" placeholder="أكتب كود JavaScript هنا..." style="display: none;"></textarea>
        </div>

        <!-- صفحة المعاينة -->
        <div class="page" id="page-preview">
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        let currentFile = 'html';

        // 1. التبديل بين ملفات الكود
        function selectFile(fileType) {
            currentFile = fileType;

            document.getElementById('code-html').style.display = 'none';
            document.getElementById('code-css').style.display = 'none';
            document.getElementById('code-js').style.display = 'none';

            document.getElementById(`code-${fileType}`).style.display = 'block';

            document.querySelectorAll('.file-chip').forEach(el => el.classList.remove('active'));
            document.getElementById(`chip-${fileType}`).classList.add('active');
        }

        // 2. التبديل بين شاشة المحرر وشاشة المعاينة
        function switchView(view) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`page-${view}`).classList.add('active');
            document.getElementById(`tab-${view}`).classList.add('active');

            if (view === 'preview') {
                updatePreview();
            }
        }

        // 3. تحديث المعاينة
        function updatePreview() {
            const html = document.getElementById('code-html').value;
            const css = `<style>${document.getElementById('code-css').value}</style>`;
            const js = `<script>${document.getElementById('code-js').value}<\/script>`;

            const frame = document.getElementById('preview-frame').contentWindow.document;
            frame.open();
            frame.write(html + css + js);
            frame.close();
        }

        function runAndPreview() {
            updatePreview();
            switchView('preview');
        }

        // 4. نشر الموقع برابط مباشر
        function publishSite() {
            const html = document.getElementById('code-html').value;
            const css = `<style>${document.getElementById('code-css').value}</style>`;
            const js = `<script>${document.getElementById('code-js').value}<\/script>`;
            const fullContent = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${css}\n</head>\n<body>\n${html}\n${js}\n</body>\n</html>`;

            const blob = new Blob([fullContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        // قيم أولية تجريبية
        document.getElementById('code-html').value = '<div class="card">\n  <h1>تطبيق محرر الأكواد</h1>\n  <p>الواجهة الآن مرتبة ومصممة للهاتف بشكل ممتاز!</p>\n  <button onclick="alert(\'عمل ممتاز!\')">تجربة</button>\n</div>';
        document.getElementById('code-css').value = 'body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }\n.card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #334155; }\nbutton { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; }';
        document.getElementById('code-js').value = '// أكتب أكواد الجافاسكربت هنا';
    </script>
</body>
</html>
