<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevStudio Ultra - NextGen IDE</title>
    <!-- استدعاء Monaco Engine الأصلي من VS Code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/vscode.min.css">
    <style>
        :root {
            --bg-main: #181818;
            --bg-sidebar: #252526;
            --accent: #0e639c;
            --accent-hover: #1177bb;
            --border: #333333;
            --text: #cccccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* الشريط العلوي */
        header { background: var(--bg-sidebar); height: 48px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; gap: 8px; }
        .brand { font-weight: bold; color: #007acc; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .header-actions { display: flex; gap: 6px; overflow-x: auto; }

        button { background: #3c3c3c; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
        button:hover { background: #454545; }
        button.btn-primary { background: var(--accent); }
        button.btn-primary:hover { background: var(--accent-hover); }

        /* واجهة العمل */
        .app-body { display: flex; flex: 1; height: calc(100vh - 48px); position: relative; }

        /* القائمة الجانبية */
        .sidebar { width: 220px; background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 10; }
        .sidebar-title { padding: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #858585; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .file-tree { flex: 1; overflow-y: auto; padding: 5px 0; }
        .file-item { padding: 8px 12px; font-size: 12px; font-family: monospace; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 3px solid transparent; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; color: #fff; border-right-color: #007acc; }

        /* منطقة التحرير والمعاينة */
        .workspace { flex: 1; display: flex; width: 100%; position: relative; }
        #editor-container { width: 50%; height: 100%; }
        .preview-pane { width: 50%; background: #ffffff; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }

        /* شريط الرموز الخاص بالهواتف */
        .mobile-bar { display: none; background: #2d2d2d; padding: 4px; overflow-x: auto; gap: 6px; border-top: 1px solid var(--border); }
        .mobile-bar button { padding: 4px 10px; font-size: 12px; }

        /* شاشات الهواتف */
        @media (max-width: 768px) {
            .sidebar { position: absolute; top: 0; right: 0; bottom: 0; transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .workspace { flex-direction: column; }
            #editor-container { width: 100%; height: 50%; }
            .preview-pane { width: 100%; height: 50%; border-right: none; border-top: 1px solid var(--border); }
            .mobile-bar { display: flex; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">⚡ DevStudio Ultra</div>
        <div class="header-actions">
            <button onclick="toggleSidebar()">📁 الملفات</button>
            <button onclick="addNewFile()">➕ ملف</button>
            <button class="btn-primary" onclick="runCode()">▶ تشغيل</button>
            <button onclick="publishProject()">🌐 نشر مجاني</button>
            <button onclick="exportSingleHTML()">💾 تنزيل</button>
        </div>
    </header>

    <div class="app-body">
        <!-- القائمة الجانبية -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-title">
                <span>المستكشف (Explorer)</span>
                <button onclick="toggleSidebar()" style="padding: 2px 6px;">✕</button>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>

        <!-- بيئة المحرر والمعاينة -->
        <div class="workspace">
            <div id="editor-container"></div>
            <div class="preview-pane">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <!-- شريط مساعدة الهواتف -->
    <div class="mobile-bar">
        <button onclick="insertSymbol('<')">&lt;</button>
        <button onclick="insertSymbol('>')">&gt;</button>
        <button onclick="insertSymbol('{')">{</button>
        <button onclick="insertSymbol('}')">}</button>
        <button onclick="insertSymbol('(')">(</button>
        <button onclick="insertSymbol(')')">)</button>
        <button onclick="insertSymbol(';')">;</button>
        <button onclick="insertSymbol('=')">=</button>
        <button onclick="insertSymbol('\"')">"</button>
    </div>

    <!-- تحميل محرك Monaco JS السحابي -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let activeFile = 'index.html';

        // قاعدة بيانات المشروعات بالذاكرة المحلية IndexedDB/LocalStorage
        const defaultProject = {
            'index.html': { lang: 'html', code: '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <div class="card">\n    <h1>تطبيق فائق السرعة!</h1>\n    <p>يعمل على الكمبيوتر والهاتف بكفاءة عالية.</p>\n    <button onclick="sayHello()">اضغط هنا</button>\n  </div>\n  <script src="app.js"><\/script>\n</body>\n</html>' },
            'style.css': { lang: 'css', code: 'body { background: #0f172a; color: #f8fafc; font-family: system-ui; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }\n.card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; border: 1px solid #334155; }\nbutton { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }' },
            'app.js': { lang: 'javascript', code: 'function sayHello() {\n  alert("التطبيق يعمل بسرعة فائقة وبدون أي أخطاء!");\n}' }
        };

        let files = JSON.parse(localStorage.getItem('devstudio_files')) || defaultProject;

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: files[activeFile].code,
                language: files[activeFile].lang,
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: window.innerWidth < 768 ? 12 : 14,
                minimap: { enabled: window.innerWidth > 768 },
                scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 }
            });

            // حفظ تلقائي فوري
            editor.onDidChangeModelContent(() => {
                files[activeFile].code = editor.getValue();
                localStorage.setItem('devstudio_files', JSON.stringify(files));
            });

            renderSidebar();
            runCode();
        });

        function renderSidebar() {
            const tree = document.getElementById('fileTree');
            tree.innerHTML = '';
            Object.keys(files).forEach(name => {
                const item = document.createElement('div');
                item.className = `file-item ${name === activeFile ? 'active' : ''}`;
                item.innerHTML = `<span>📄 ${name}</span>`;
                item.onclick = () => switchFile(name);
                tree.appendChild(item);
            });
        }

        function switchFile(name) {
            files[activeFile].code = editor.getValue();
            activeFile = name;
            monaco.editor.setModelLanguage(editor.getModel(), files[name].lang);
            editor.setValue(files[name].code);
            renderSidebar();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function addNewFile() {
            const name = prompt("أدخل اسم الملف الجديد (مثل: script.js أو theme.css):");
            if (name && !files[name]) {
                const ext = name.split('.').pop();
                const langMap = { js: 'javascript', css: 'css', html: 'html' };
                files[name] = { lang: langMap[ext] || 'plaintext', code: '' };
                switchFile(name);
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function runCode() {
            const html = files['index.html'] ? files['index.html'].code : '';
            const css = files['style.css'] ? `<style>${files['style.css'].code}</style>` : '';
            const js = files['app.js'] ? `<script>${files['app.js'].code}<\/script>` : '';

            const frame = document.getElementById('previewFrame').contentWindow.document;
            frame.open();
            frame.write(html + css + js);
            frame.close();
        }

        function publishProject() {
            const html = files['index.html'] ? files['index.html'].code : '';
            const css = `<style>${files['style.css'] ? files['style.css'].code : ''}</style>`;
            const js = `<script>${files['app.js'] ? files['app.js'].code : ''}<\/script>`;
            const fullContent = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n${css}\n</head>\n<body>\n${html}\n${js}\n</body>\n</html>`;

            const blob = new Blob([fullContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        function exportSingleHTML() {
            const html = files['index.html'] ? files['index.html'].code : '';
            const css = `<style>${files['style.css'] ? files['style.css'].code : ''}</style>`;
            const js = `<script>${files['app.js'] ? files['app.js'].code : ''}<\/script>`;
            const fullContent = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n${css}\n</head>\n<body>\n${html}\n${js}\n</body>\n</html>`;

            const blob = new Blob([fullContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'project.html';
            a.click();
        }

        function insertSymbol(symbol) {
            if (editor) {
                const selection = editor.getSelection();
                editor.executeEdits('', [{ range: selection, text: symbol, forceMoveMarkers: true }]);
                editor.focus();
            }
        }
    </script>
</body>
</html>
